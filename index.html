<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Louder Efemérides · Editorial</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#1c2030;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}header{padding:26px 5%;background:white;border-bottom:1px solid #e6e7e5}h1{font-size:clamp(27px,4vw,44px);margin:7px 0}header p{color:#69717a}main{max-width:1200px;margin:auto;padding:28px 22px}.brand{font-weight:900;letter-spacing:.12em;color:#328a4c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{background:white;border:1px solid #e8e8e5;border-radius:17px;padding:22px}.stat strong{display:block;font-size:33px}.stat span,.muted{color:#707984}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}input,select,button{padding:12px 15px;border-radius:10px;border:1px solid #d9dcd9;background:white;font:inherit}input{flex:1;min-width:200px}button{cursor:pointer}button.active{background:#2f8d4d;color:white;border-color:#2f8d4d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel h2{margin:0 0 16px;font-size:20px}.entry{padding:15px 0;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.entry small{display:block;color:#737b84;margin-top:5px}.pill{font-size:12px;background:#f1f5f1;padding:5px 8px;border-radius:8px;height:max-content}.empty{color:#727982;padding:20px 0}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat{padding:15px}}
</style></head><body><header><div class="brand">LOUDER / EDITORIAL</div><h1>Efemérides musicales</h1><p>Cumpleaños, aniversarios y planeación de contenidos · Panel independiente de WordPress</p></header><main><section class="stats"><div class="stat"><strong id="people">—</strong><span>Músicos registrados · meta 600</span></div><div class="stat"><strong id="verified">—</strong><span>Fechas verificadas en la base</span></div><div class="stat"><strong id="records">—</strong><span>Efemérides disponibles</span></div></section><div class="toolbar"><input id="q" placeholder="Buscar músico, banda o disco…" aria-label="Buscar"><select id="kind"><option value="all">Todos los eventos</option><option value="birthday">Cumpleaños</option><option value="album">Discos</option></select><button data-days="7">7 días</button><button data-days="30" class="active">30 días</button><button data-days="365">Todo el año</button></div><section class="grid"><div class="panel"><h2>Próximas efemérides</h2><div id="events"></div></div><div class="panel"><h2>Base editorial</h2><div id="catalog"></div></div></section><p class="muted" id="updated"></p></main><script>
let records=[],days=30;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function next(date){if(!date)return null;const m=/^\d{4}-(\d\d)-(\d\d)$/.exec(date);if(!m)return null;let now=new Date(),d=new Date(now.getFullYear(),+m[1]-1,+m[2]);d.setHours(0,0,0,0);if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1);return d}function render(){let query=$('q').value.toLowerCase(),kind=$('kind').value;let matching=records.filter(r=>(r.name+' '+r.project).toLowerCase().includes(query)&&(kind==='all'||r.type===kind));$('people').textContent=new Set(records.filter(r=>r.type==='birthday').map(r=>r.name)).size;$('verified').textContent=records.filter(r=>r.date&&r.status==='Verificado').length;$('records').textContent=records.length;let upcoming=matching.map(r=>({...r,next:next(r.date)})).filter(r=>r.next&&((r.next-new Date().setHours(0,0,0,0))/86400000)<=days).sort((a,b)=>a.next-b.next);$('events').innerHTML=upcoming.length?upcoming.map(r=>'<div class="entry"><div><b>'+esc(r.name)+'</b><small>'+esc(r.project)+' · '+r.next.toLocaleDateString('es-MX',{day:'numeric',month:'long'})+'</small></div><span class="pill">'+(r.type==='album'?'Disco':'Cumpleaños')+'</span></div>').join(''):'<p class="empty">Sin eventos registrados en este periodo.</p>';$('catalog').innerHTML=matching.length?matching.slice(0,120).map(r=>'<div class="entry"><div><b>'+esc(r.name)+'</b><small>'+esc(r.project)+'</small></div><span class="pill">'+esc(r.status||'Pendiente')+'</span></div>').join(''):'<p class="empty">No hay coincidencias.</p>'}document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=+b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));render()});$('q').oninput=render;$('kind').onchange=render;fetch('data/verified-albums.json').then(r=>{if(!r.ok)throw Error('sin datos');return r.json()}).then(d=>{records=d.records||[];$('updated').textContent='Datos actualizados: '+(d.generated_at||'sin fecha');render()}).catch(()=>{$('updated').textContent='No se pudo cargar el archivo de datos.';render()});
</script></body></html>
